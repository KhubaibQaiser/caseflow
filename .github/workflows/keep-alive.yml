name: Keep alive

# A daily query stops the free Supabase project from pausing (ADR-0008).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # DEPLOY_ENABLED is a repository variable; T23 sets it.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      # anon can't read tables (RLS and revoked grants); ping() is granted to anon for this.
      - name: Ping the database
        run: |
          check() {
            code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$@" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
            echo "$code"
            [ "$code" = 200 ]
          }
          check -X POST "$SUPABASE_URL/rest/v1/rpc/ping"
